<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="apGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C5CFC"/>
      <stop offset="55%" stop-color="#C24CFF"/>
      <stop offset="100%" stop-color="#FF3D9A"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#33F0C8"/>
      <stop offset="100%" stop-color="#7C5CFC"/>
    </linearGradient>
  </defs>

  <!-- backing tile -->
  <rect x="8" y="8" width="240" height="240" rx="56" fill="#0A0A12"/>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#apGrad)" opacity="0.14"/>
  <rect x="8.5" y="8.5" width="239" height="239" rx="55.5" fill="none" stroke="url(#apGrad)" stroke-width="1.5"/>

  <!-- orbit ring -->
  <circle cx="128" cy="128" r="86" fill="none" stroke="url(#apGrad)" stroke-width="2" opacity="0.35"/>

  <!-- waveform bars forming an "A" silhouette rhythm -->
  <g>
    <rect x="70"  y="140" width="10" height="34" rx="5" fill="url(#barGrad)"/>
    <rect x="86"  y="118" width="10" height="56" rx="5" fill="url(#barGrad)"/>
    <rect x="102" y="96"  width="10" height="78" rx="5" fill="url(#barGrad)"/>
    <rect x="118" y="80"  width="10" height="94" rx="5" fill="#FF3D9A"/>
    <rect x="134" y="96"  width="10" height="78" rx="5" fill="url(#barGrad)"/>
    <rect x="150" y="118" width="10" height="56" rx="5" fill="url(#barGrad)"/>
    <rect x="166" y="140" width="10" height="34" rx="5" fill="url(#barGrad)"/>
  </g>

  <!-- play triangle notch, cut from bottom-right of ring -->
  <circle cx="128" cy="128" r="10" fill="#0A0A12"/>
  <path d="M124 123 L134 128 L124 133 Z" fill="#F1F0F5"/>
</svg>